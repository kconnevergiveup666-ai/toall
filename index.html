<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>欧盟法规观察</title>
<meta name="description" content="为进入欧洲的中国电池、储能、汽车与材料企业跟踪欧盟法规动态、征求意见、配套法案进度与合规影响。">
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#14181f; --ink2:#4a5261; --ink3:#7a8292; --line:#e3e6eb; --line2:#eef0f3;
  --brand:#1f4fd1; --brand-soft:#e8eefc; --ok:#16794a; --ok-soft:#e5f4ec; --warn:#a15c00; --warn-soft:#fdf1df;
  --bad:#b42318; --bad-soft:#fdeceb; --muted-soft:#f1f2f5; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1217; --card:#171b22; --ink:#e8ebf0; --ink2:#b4bbc7; --ink3:#838b99; --line:#2a303a; --line2:#20252d;
  --brand:#7ea2ff; --brand-soft:#1c2740; --ok:#4cc38a; --ok-soft:#14291f; --warn:#f0b44c; --warn-soft:#2e2414;
  --bad:#ff7b6e; --bad-soft:#331a18; --muted-soft:#1e232b; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1217; --card:#171b22; --ink:#e8ebf0; --ink2:#b4bbc7; --ink3:#838b99; --line:#2a303a; --line2:#20252d;
  --brand:#7ea2ff; --brand-soft:#1c2740; --ok:#4cc38a; --ok-soft:#14291f; --warn:#f0b44c; --warn-soft:#2e2414;
  --bad:#ff7b6e; --bad-soft:#331a18; --muted-soft:#1e232b; --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-padding-top:112px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
h1,h2,h3{line-height:1.3;margin:0}
/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;height:52px}
.brand{font-weight:700;color:var(--ink);white-space:nowrap;font-size:15px}
.roles{margin-left:auto;display:flex;gap:2px;background:var(--muted-soft);border-radius:999px;padding:3px;overflow-x:auto;scrollbar-width:none}
.roles::-webkit-scrollbar{display:none}
.roles button{border:0;background:none;color:var(--ink2);font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.roles button[aria-selected="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.roles .short{display:none}
@media (max-width:420px){.roles .full{display:none}.roles .short{display:inline}.roles button{padding:5px 11px}}
.secnav{border-top:1px solid var(--line2)}
.secnav-in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;height:42px;align-items:center}
.secnav-in::-webkit-scrollbar{display:none}
.secnav a{color:var(--ink2);font-size:13px;padding:5px 10px;border-radius:8px;white-space:nowrap}
.secnav a:hover{background:var(--muted-soft);text-decoration:none}
.secnav a.on{color:var(--brand);background:var(--brand-soft);font-weight:600}
/* hero */
.hero{padding:28px 0 8px}
.crumbs{font-size:13px;color:var(--ink3);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--muted-soft);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.brand{background:var(--brand-soft);color:var(--brand)}
.hero h1{font-size:30px;margin:10px 0 4px;letter-spacing:-.01em}
.hero .ref{color:var(--ink3);font-size:14px}
.headline{font-size:17px;line-height:1.7;margin:16px 0 0;color:var(--ink);max-width:62em}
.more{margin-top:10px}
.more summary{cursor:pointer;color:var(--brand);font-size:14px;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:" ▾"} .more[open] summary::after{content:" ▴"}
.more p{color:var(--ink2);margin:8px 0 0;max-width:62em}
/* key figures */
.kf{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:22px 0 4px}
.kf .k{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kf .v{font-size:22px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kf .l{font-size:14px;font-weight:600;margin-top:2px}
.kf .n{font-size:12.5px;color:var(--ink3);margin-top:4px;line-height:1.5}
/* sections */
.sec{margin:34px 0 0}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-size:21px}
.sec-h .sub{color:var(--ink3);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.src{font-size:12px;color:var(--ink3);margin-top:10px}
.src a{color:var(--ink3);text-decoration:underline;text-underline-offset:2px}
/* you */
.you{display:grid;grid-template-columns:1.1fr 1fr;gap:0}
.you .l{padding:20px;border-right:1px solid var(--line2)}
.you .r{padding:20px}
.lv{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
.lv.high{background:var(--bad-soft);color:var(--bad)} .lv.mid{background:var(--warn-soft);color:var(--warn)} .lv.low{background:var(--ok-soft);color:var(--ok)}
.you .verdict{font-size:17px;font-weight:600;margin:10px 0 0;line-height:1.55}
.you h3{font-size:13px;color:var(--ink3);font-weight:600;margin:16px 0 6px;letter-spacing:.02em}
.you .l h3:first-of-type{margin-top:18px}
ul.dots{margin:0;padding:0;list-style:none}
ul.dots li{position:relative;padding-left:16px;margin:5px 0;color:var(--ink2)}
ul.dots li::before{content:"";position:absolute;left:3px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--ink3)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 34px;border-bottom:1px dashed var(--line2)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:12px;font-weight:700;display:grid;place-items:center}
.chain{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--muted-soft);font-size:13.5px;color:var(--ink2)}
.chain b{color:var(--ink)}
.tabs3{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
/* timeline */
.tl-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3);margin-bottom:10px}
.tl-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tl{position:relative;margin:0;padding:6px 0 6px;list-style:none}
.tl::before{content:"";position:absolute;left:107px;top:0;bottom:0;width:2px;background:var(--line)}
.tl li{position:relative;display:grid;grid-template-columns:92px 1fr;gap:30px;padding:9px 0}
.tl .d{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;padding-top:1px}
.tl .d small{display:block;font-weight:400;font-size:11.5px;color:var(--ink3)}
.tl .dot{position:absolute;left:101px;top:14px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--ink3)}
.tl li.past .dot{background:var(--ink3);border-color:var(--ink3)}
.tl li.soon .dot{border-color:var(--brand);background:var(--brand)}
.tl li.cond .dot{border-style:dashed;border-color:var(--warn);background:var(--card)}
.tl li.past .t{color:var(--ink2)}
.tl .t{font-size:14.5px}
.tl .m{font-size:12.5px;color:var(--ink3);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.tl .today{padding:4px 0}
.tl .today .d{color:var(--brand);font-size:12px}
.tl .today .bar{height:2px;background:var(--brand);margin-top:10px;opacity:.6}
.tl .today .dot{width:10px;height:10px;left:103px;top:9px;border:0;background:var(--brand)}
/* scope */
.scope-pick{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.scope-pick button{border:1px solid var(--line);background:var(--card);color:var(--ink2);font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.scope-pick button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.tbl-wrap{overflow-x:auto}
table.mx{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.mx th,table.mx td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
table.mx thead th{font-size:12.5px;color:var(--ink3);font-weight:600;background:var(--muted-soft);white-space:nowrap}
table.mx thead th:first-child{border-top-left-radius:10px} table.mx thead th:last-child{border-top-right-radius:10px}
table.mx tbody th{font-weight:600;white-space:nowrap}
table.mx tbody th small{display:block;font-weight:400;color:var(--ink3);font-size:11.5px}
.c{display:inline-block;padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums;line-height:1.45}
.c.now{background:var(--ok-soft);color:var(--ok)} .c.next{background:var(--brand-soft);color:var(--brand)} .c.cond{background:var(--warn-soft);color:var(--warn)} .c.na{color:var(--ink3)}
.mx-list{display:none}
.mx-list .row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.mx-list .row:last-child{border-bottom:0}
.mx-list .row span:first-child{font-weight:600}
.mx-list .row small{display:block;color:var(--ink3);font-weight:400;font-size:12px}
.mx-list .row .c{text-align:right;flex:none;max-width:55%}
/* obligations */
.ob-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink2);font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;cursor:pointer}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.obs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ob{padding:16px 18px;display:flex;flex-direction:column}
.ob .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ob h3{font-size:16px}
.ob .grp{font-size:12px;color:var(--ink3)}
.ob .when{text-align:right;flex:none;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.ob .when small{display:block;font-weight:400;font-size:11.5px;color:var(--ink3)}
.ob .ap{font-size:13px;color:var(--ink2);margin-top:8px}
.ob .ap b{color:var(--ink3);font-weight:500;margin-right:4px}
.ob p.req{margin:10px 0 0;font-size:14px;line-height:1.7}
.ob .ft{margin-top:auto;padding-top:12px;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--ink3)}
.ob .ft .acts{display:flex;flex-wrap:wrap;gap:6px}
.ob details{margin-top:10px;font-size:13px;color:var(--ink2)}
.ob details summary{cursor:pointer;color:var(--brand)}
/* acts board */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat{padding:12px 14px}
.stat .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--ink3)}
.stat.bad .v{color:var(--bad)} .stat.ok .v{color:var(--ok)}
.prog{height:8px;border-radius:999px;background:var(--muted-soft);overflow:hidden;display:flex;margin:4px 0 14px}
.prog i{display:block;height:100%}
.acts{list-style:none;margin:0;padding:0}
.act{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:12px 18px;border-bottom:1px solid var(--line2)}
.act:last-child{border-bottom:0}
.act .tt{font-weight:600;font-size:14.5px}
.act .tt a{color:var(--ink)}
.act .meta{font-size:12.5px;color:var(--ink3);display:flex;flex-wrap:wrap;gap:4px 12px}
.act .st{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.act .st small{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.act .aff{grid-column:1/-1;font-size:13px;color:var(--ink2)}
.grp-h{padding:10px 18px;font-size:12.5px;font-weight:600;color:var(--ink3);background:var(--muted-soft);border-bottom:1px solid var(--line2)}
.grp-h:first-child{border-radius:var(--r) var(--r) 0 0}
/* analyst */
.an{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.an .card{padding:18px}
.an h3{font-size:14px;margin-bottom:10px}
.judg{list-style:none;margin:0;padding:0;counter-reset:j}
.judg li{counter-increment:j;padding:10px 0 10px 40px;position:relative;border-bottom:1px solid var(--line2);font-size:14.5px;line-height:1.7}
.judg li:last-child{border-bottom:0}
.judg li::before{content:counter(j,decimal-leading-zero);position:absolute;left:0;top:10px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.an .side{display:flex;flex-direction:column;gap:12px}
.sig li::before{background:var(--brand)!important}
.an-note{font-size:12px;color:var(--ink3);margin-top:10px}
/* member states */
.ms{list-style:none;margin:0;padding:0}
.ms li{display:grid;grid-template-columns:84px 1fr 1fr;gap:4px 16px;padding:12px 18px;border-bottom:1px solid var(--line2);font-size:13.5px}
.ms li:last-child{border-bottom:0}
.ms .cn{font-weight:700;font-size:14.5px}
.ms .rg{color:var(--ink2)} .ms .rg b{display:block;color:var(--ink);font-weight:600}
.ms .nt{color:var(--ink2)}
/* updates & sources */
.chip .cnt{opacity:.6;font-size:12px;margin-left:2px}
.ups2{list-style:none;margin:0;padding:0}
.up{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line2)}
.up:last-child{border-bottom:0}
.up-d time{display:block;color:var(--ink3);font-size:13px;font-variant-numeric:tabular-nums;padding-top:2px}
.up-d .pill{margin-top:4px}
.up-m{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px}
.up-m b{font-weight:600}
.ty{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--muted-soft);color:var(--ink2)}
.ty-eu{background:var(--brand-soft);color:var(--brand)} .ty-assoc{background:var(--warn-soft);color:var(--warn)} .ty-ngo{background:var(--ok-soft);color:var(--ok)} .ty-cn{background:var(--bad-soft);color:var(--bad)}
.tp{color:var(--ink3);font-size:12px}
.up-t{font-weight:600;font-size:15.5px;margin-top:6px;line-height:1.5}
.up-x{margin:6px 0 0;color:var(--ink2);font-size:14px}
.up-i{margin-top:8px;padding:8px 12px;border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:0 8px 8px 0;font-size:13.5px}
.up-i b{display:block;font-size:12px;color:var(--brand);margin-bottom:2px}
.up-s{margin-top:8px;font-size:12.5px}
.morebtn{display:block;width:100%;border:0;border-top:1px solid var(--line2);background:none;color:var(--brand);font:inherit;font-size:14px;padding:12px;cursor:pointer;border-radius:0 0 var(--r) var(--r)}
.morebtn:hover{background:var(--muted-soft)}
.sub-h{font-size:16px;margin:22px 0 10px}
.issues{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.iss{padding:16px 18px}
.iss-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.iss-h h3{font-size:15px;line-height:1.45}
.iss-w{margin:6px 0 10px;color:var(--ink3);font-size:13px}
.sides{list-style:none;margin:0;padding:0}
.sides li{padding:8px 0;border-top:1px dashed var(--line2);font-size:13.5px;color:var(--ink2)}
.sides .who{font-weight:600;color:var(--ink);margin-bottom:2px}
.ups{list-style:none;margin:0;padding:0}
.ups li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line2);font-size:14px}
.ups li:last-child{border-bottom:0}
.ups time{color:var(--ink3);font-variant-numeric:tabular-nums;font-size:13px;padding-top:1px}
.srcs{list-style:none;margin:0;padding:0}
.srcs li{padding:10px 18px;border-bottom:1px solid var(--line2);font-size:14px}
.srcs li:last-child{border-bottom:0}
.foot{color:var(--ink3);font-size:12.5px;padding-top:36px;padding-bottom:40px}
/* consult & calc */
.banner{padding:12px 16px;border-radius:12px;background:var(--muted-soft);font-size:14px;margin-bottom:12px;color:var(--ink2)}
.banner b{color:var(--ink)} .banner.hot{background:var(--bad-soft)}
.cs{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;align-items:start}
.how h3{font-size:15px;margin-bottom:6px}
.how ol.steps li{font-size:13.5px;color:var(--ink2)}
.nx{color:var(--ink3);font-size:12.5px}
.calc-in{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;margin-bottom:14px}
.calc-in input{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.tbl-wrap2{overflow-x:auto}
table.calc td.num{white-space:nowrap;font-variant-numeric:tabular-nums}
table.calc td.res{font-weight:700;font-size:14px}
table.calc .mt{font-size:12px;color:var(--ink3);margin-top:3px}
/* responsive */
@media (max-width:760px){
  html{scroll-padding-top:104px}
  .hero h1{font-size:25px}
  .headline{font-size:16px}
  .kf{grid-template-columns:1fr 1fr;gap:10px}
  .kf .k{padding:12px}
  .kf .v{font-size:18px}
  .kf .k:last-child:nth-child(odd){grid-column:1/-1}
  .you{grid-template-columns:1fr}
  .you .l{border-right:0;border-bottom:1px solid var(--line2);padding:16px}
  .you .r{padding:16px}
  .tl::before{left:13px}
  .tl li{grid-template-columns:1fr;gap:2px;padding:8px 0 8px 36px}
  .tl .d{text-align:left;display:flex;gap:8px;align-items:baseline}
  .tl .d small{display:inline}
  .tl .dot{left:7px;top:13px}
  .tl .today .dot{left:9px;top:9px}
  .tl .today .bar{display:none}
  .scope-pick{display:flex}
  .tbl-wrap{display:none}
  .mx-list{display:block}
  .obs{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .an{grid-template-columns:1fr}
  .ms li{grid-template-columns:1fr;padding:12px 16px}
  .ups li{grid-template-columns:1fr;gap:2px;padding:10px 16px}
  .up{grid-template-columns:1fr;gap:4px;padding:14px 16px}
  .up-d{display:flex;gap:8px;align-items:center}
  .up-d .pill{margin-top:0}
  .issues{grid-template-columns:1fr}
  .cs{grid-template-columns:1fr}
  table.calc thead{display:none}
  table.calc, table.calc tbody, table.calc tr, table.calc th, table.calc td{display:block;width:100%}
  table.calc tr{padding:10px 0;border-bottom:1px solid var(--line2)}
  table.calc th, table.calc td{border:0;padding:2px 0}
  table.calc td.num{display:inline-block;width:auto;margin-right:10px}
  table.calc td.num:nth-of-type(2)::before{content:"最早 ";color:var(--ink3);font-weight:400}
  table.calc td.res::before{content:"→ ";color:var(--ink3)}
  .act{grid-template-columns:1fr;padding:12px 16px}
  .act .st{flex-direction:row;align-items:center;justify-content:flex-start;text-align:left}
  .brand{font-size:14px}
}

/* ===================== visual polish v2 ===================== */
:root{--brand2:#0e9384;--grad:linear-gradient(135deg,#1f4fd1 0%,#3b6cf0 55%,#0e9384 100%);--shadow2:0 1px 2px rgba(16,24,40,.04),0 8px 24px -8px rgba(16,24,40,.10);--r:16px}

/* hero band */
.hero{position:relative;padding:34px 0 10px}
.hero::before{content:"";position:absolute;top:-1px;bottom:0;left:50%;width:100vw;margin-left:-50vw;z-index:-1;
  background:radial-gradient(900px 340px at 15% -10%,color-mix(in srgb,var(--brand) 14%,transparent),transparent 70%),radial-gradient(700px 300px at 95% 0%,color-mix(in srgb,var(--brand2) 12%,transparent),transparent 70%),
  linear-gradient(to bottom,transparent 60%,var(--bg));}
.hero-g{display:grid;grid-template-columns:1fr 270px;gap:28px;align-items:start}
.crumbs{gap:8px}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 25%,transparent)}
.hero h1{font-size:36px;font-weight:800;letter-spacing:-.02em;margin:14px 0 6px;background:linear-gradient(90deg,var(--ink),color-mix(in srgb,var(--ink) 70%,var(--brand)));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .ref .sep{margin:0 8px;opacity:.5}
.headline{font-size:17.5px;line-height:1.8}
/* countdown */
.cd{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow2);position:relative;overflow:hidden}

.cd-n small{font-size:16px;margin-left:4px;-webkit-text-fill-color:var(--ink2);font-weight:600}
.cd-d{font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.cd-t{font-size:13.5px;color:var(--ink2);margin-top:6px;line-height:1.6}
.cd a{display:inline-block;margin-top:10px;font-size:13px;font-weight:600}
/* overview strip */
.strip{position:relative;margin:30px 4px 6px;height:46px}
.sb{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:999px;background:var(--line)}
.sp{display:block;height:100%;border-radius:999px;background:var(--grad);opacity:.85}
.sd{position:absolute;top:5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--card);border:3px solid var(--brand);cursor:help;transition:transform .15s}

.tks{position:absolute;left:0;right:0;top:24px;height:18px}

/* key figures */
.kf{gap:14px;margin-top:18px}
.kf .k{position:relative;padding:16px 18px 15px;border-color:var(--line2);box-shadow:var(--shadow2);overflow:hidden}
.kf .k::after{content:"";position:absolute;left:18px;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.kf .k1::after{background:var(--brand2)} .kf .k2::after{background:#7a5af8} .kf .k3::after{background:var(--ok)} .kf .k4::after{background:var(--warn)}

.sec{margin-top:52px}

/* you */
.you .verdict{font-size:18px}
.you .r{background:linear-gradient(180deg,color-mix(in srgb,var(--brand-soft) 55%,transparent),transparent 60%)}
/* updates */
.up{position:relative;transition:background .15s}
.up:hover{background:color-mix(in srgb,var(--muted-soft) 60%,transparent)}
.up::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--line)}
.up-eu::before{background:var(--brand)} .up-assoc::before{background:var(--warn)} .up-ngo::before{background:var(--ok)} .up-cn::before{background:var(--bad)} .up-ms::before{background:#7a5af8}

/* issues */
.iss{position:relative;overflow:hidden}
.iss::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--grad);opacity:.8}
/* timeline */
.tl li.soon .dot{box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 20%,transparent)}
.tl li:not(.today):hover .t{color:var(--brand)}
/* scope matrix */
table.mx tbody tr:hover td,table.mx tbody tr:hover th{background:color-mix(in srgb,var(--muted-soft) 55%,transparent)}
/* obligations */
.ob{transition:transform .15s,box-shadow .2s}
.ob:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,24,40,.05),0 14px 32px -12px rgba(16,24,40,.18)}

/* acts top */
.acts-top{display:flex;gap:22px;align-items:center;margin-bottom:12px}
.acts-top .stats{flex:1;margin:0}
.acts-top .stat{box-shadow:none;border:0;background:var(--muted-soft);border-radius:12px}

    "65% 单一来源上限是基准而非禁令，但它已经成为欧盟补贴、公共采购和项目评审的“隐性评分项”。高度依赖中国石墨、前驱体和稀土的供应链，在欧洲客户采购评价中的压力会持续上升。",

  "headline": "欧委会审查非欧盟政府补贴是否扭曲欧盟市场的工具。达到门槛的并购和大型公共采购投标须事先申报所获外国财政资助，欧委会还可依职权调查任何企业。迄今的深入调查几乎都针对中国企业，是中国电池、储能和整车企业在欧投资与投标必须面对的审查。",

  "headline": "把电池与储能列为净零技术，目标 2030 年欧盟本土制造满足 40% 部署需求。对中国企业影响最直接的是“韧性”标准：可再生能源拍卖和公共采购中，来自供应占比超过 50% 的单一第三国的技术或主要部件将处于不利地位，相关条款已于 2025 年 12 月和 2026 年 6 月起适用。",

   "judgments": [
    "黑粉列为危险废物是对中国回收产业链影响最大的单项规则：在欧回收的黑粉不能再运回国内湿法冶金提炼，在欧建设或合作湿法冶金产能成为保住回收原料的唯一路径。",
    "在欧电池工厂的正极边角料、不合格电芯同样是危险废物，跨境运输到其他成员国处理须走事先通知与同意程序，周期和成本都需要纳入工厂运营规划。",
    "非经合组织国家清单将在 2027 年 5 月前确定。负极边角料等非危险废料能否出口到中国，取决于中国是否申请并被列入清单。"

oc&lg=EN&numdoc=32023R0988"}, {"id": "rohs", "name": "电子电气设备有害物质限制指令（RoHS）", "short": "RoHS 指令", "category": "safety", "relevance": "medium", "tags": ["有害物质", "BMS", "变流器", "CE"], "summary": "指令 2011/65/EU（RoHS 2），限制电子电气设备中铅、汞、镉、六价铬、多溴联苯、多溴二苯醚及四种邻苯二甲酸酯的含量，作为 CE 标志的前提。电池本身不适用 RoHS（由新电池法管理），但储能系统中的 BMS、变流器、线缆和充电设备须符合。", "impacts": ["储能系统中的电子部件须提供 RoHS 符合性文件"], "status": "已生效", "stage": "已生效", "ref": "指令 2011/65/EU", "parent": null, "secondary": false, "levels": {"battery": "mid", "auto": "low", "storage": "mid", "upstream": null}, "batteryNote": "储能系统的电子部件须符合", "last": ["2013-01-02", "成员国转化期限"], "next": null, "milestones": [{"date": "2011-07-21", "kind": "force", "label": "指令生效"}, {"date": "2013-01-02", "kind": "transpose", "label": "成员国转化期限"}], "deep": false, "oeil": "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2008/0240(COD)", "url": "https://eur-lex.europa.eu/smartapi/cgi/sga_doc?smartapi!celexplus!prod!CELEXnumdoc&lg=EN&numdoc=32011L0065"}, {"id": "pfas", "name": "PFAS（全氟和多氟烷基物质）通用限制", "short": "PFAS 通用限制", "category": "safety", "relevance": "high", "tags": ["PFAS", "PVDF", "电解液", "REACH"], "summary": "五国于 2023 年提交、按 REACH 限制程序推进的 PFAS 通用限制提案，覆盖约一万种物质。ECHA 风险评估委员会（RAC）于 2026-03-02 通过意见，拒绝对含氟聚合物整体豁免；社会经济分析委员会（SEAC）2026-03-10 通过意见草案并征求意见至 05-25，未接受将含氟聚合物排除在范围外，但支持对无替代品的特定用途给予有针对性的豁免，最终意见预计 2026 年底，之后由欧委会和 REACH 委员会决定。欧委会 2026-04 宣布不再提出 REACH 全面修订，但明确 PFAS 限制不受影响。", "impacts": ["PVDF 粘结剂、含氟电解液添加剂和隔膜涂层可能受限，取决于电池用途能否获得豁免及过渡期长短"], "status": "草案", "stage": "配套法案", "ref": "REACH 附件十七限制提案（PFAS 通用限制）", "parent": null, "secondary": true, "levels": {"battery": "high", "auto": "mid", "storage": "mid", "upstream": "high"}, "batteryNote": "PVDF 等含氟材料广泛用于电极粘结剂和电解液", "last": ["2026-05-25", "SEAC 意见草案征求意见截止"], "next": null, "milestones": [{"date": "2026-03-02", "kind": "secondary", "label": "ECHA 风险评估委员会（RAC）通过意见"}, {"date": "2026-05-25", "kind": "secondary", "label": "SEAC 意见草案征求意见截止"}], "deep": false, "oeil": "", "url": "https://echa.europa.eu/-/echa-to-consu pa.eu/smartapi/cgi/sga_doc?smartapi!celexplus!prod!CELEXnumdoc&lg=EN&numdoc=32024R2847"}, {"id": "cra-important", "name": "网络韧性法重要产品与关键产品技术描述", "short": "CRA 重要产品清单", "category": "digital", "relevance": "high", "tags": ["重要产品", "关键产品", "合格评定"], "summary": "实施条例 (EU) 2025/2392，为网络韧性法附件三、四中的 28 类重要产品和关键产品给出精确技术描述，决定哪些产品须采用协调标准或第三方合格评定。欧委会能源专家组已建议将光伏逆变器列为 II 类重要产品。", "impacts": ["储能系统中的网关、路由、操作系统类软件等若属于重要产品，合格评定要求更严格"], "status": "已通过", "stage": "配套法案", "ref": "实施条例 (EU) 2025/2392", "parent": "cra", "secondary": true, "levels": {"battery": "high", "auto": "low", "storage": "high", "upstream": null}, "batteryNote": "决定联网储能部件的合格评定路径", "last": ["2025-11-28", "欧委会通过实施条例"], "next": null, "milestones": [{"date": "2025-11-28", "kind": "secondary", "label": "欧委会通过实施条例"}], "deep": false, "oeil": "", "url": ""}, {"id": "nis2", "name": "网络与信息系统安全指令（NIS2）", "short": "NIS2 指令", "category": "digital", "relevance": "high", "tags": ["关键基础设施", "能源行业", "储能运营商", "充电运营商", "电气设备制造", "事件报告", "供应链安全"], "summary": "指令 (EU) 2022/2555，取代 NIS1。将网络安全义务扩展到 18 个行业的中大型实体：附件一“高度关键行业”包括电力（发电、输配电、聚合商、需求响应与储能运营商、充电点运营商）、油气、氢能等；附件二“其他关键行业”包括电气设备制造和汽车制造。实体须落实风险管理措施（含供应链安全），并履行 24 小时预警/72 小时通报/1 个月最终报告的事件报告义务；管理层对网络安全承担个人责任。电力行业另有《网络安全网络规范》（授权条例 (EU) 2024/1366）。", "impacts": ["中大型电池/电气设备制造商属于“重要实体”，储能电站运营商、聚合商、充电运营商属于能源行业“基本实体”", "须建立网络安全风险管理体系与事件报告流程，最高罚款为全球营业额 2%（基本实体）或 1.4%（重要实体）", "供应链安全要求向上游传导：客户（电网、能源企业）将在采购中要求设备供应商提供安全保证", "电力行业网络安全网络规范（NCCS）对跨境电力流相关实体提出额外风险评估要求"], "status": "已生效", "stage": "已生效", "ref": "指令 (EU) 2022/2555", "parent": null, "secondary": false, "levels": {"battery": "high", "auto": "high", "storage": "high", "upstream": "low"}, "batteryNote": "中大型电池制造商在欧子公司属于“重要实体”，储能客户则是“基本实体”", "last": ["2025-04-17", "成员国确定基本实体与重要实体清单"], "next": null, "milestones": [{"date": "2023-01-16", "kind": "force", "label": "指令生效"}, {"date": "2024-06-13", "kind": "secondary", "label": "电力行业网络安全网络规范（授权条例 (EU) 2024/1366）生效"}, {"date": "2024-10-17", "kind": "transpose", "label": "成员国转化期限"}, {"date": "2024-10-18 ": "主要影响储能 EMS 中的 AI 功能和在欧工厂使用的 AI", "last": ["2026-08-02", "法规一般性适用（高风险义务除外，见下）"], "next": {"date": "2027-12-02", "kind": "deadline", "label": "附件三高风险 AI 系统义务适用（原定 2026-08-02，经 2026/1744 推迟）"}, "milestones": [{"date": "2024-08-01", "kind": "force", "label": "法规生效"}, {"date": "2025-02-02", "kind": "apply", "label": "禁止性 AI 实践与 AI 素养义务适用"}, {"date": "2025-08-02", "kind": "apply", "label": "通用 AI 模型义务、治理与罚则条款适用"}, {"date": "2026-08-02", "kind": "apply", "label": "法规一般性适用（高风险义务除外，见下）"}, {"date": "2027-12-02", "kind": "deadline", "label": "附件三高风险 AI 系统义务适用（原定 2026-08-02，经 2026/1744 推迟）"}, {"date": "2028-08-02", "kind": "deadline", "label": "附件一产品中的高风险 AI 系统义务适用（原定 2027-08-02，经 2026/1744 推迟）"}], "deep": false, "oeil": "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2021/0106(COD)", "url": "https://eur-lex.europa.eu/smartapi/cgi/sga_doc?smartapi!celexplus!prod!CELEXnumdoc&lg=EN&numdoc=32024R1689"}, {"id": "ai-omnibus", "name": "AI 数字简化条例（Digital Omnibus on AI）", "short": "AI 简化条例", "category": "digital", "relevance": "high", "tags": ["Omnibus 简化", "高风险推迟"], "summary": "2025 年 11 月 19 日作为“数字简化一揽子”的一部分提出，2026 年 7 月 24 日以条例 (EU) 2026/1744 发布。将高风险 AI 义务改为固定日期：附件三系统推迟至 2027 年 12 月 2 日，附件一产品中的系统推迟至 2028 年 8 月 2 日；成员国 AI 监管沙盒设立期限推迟至 2027 年 8 月 2 日；扩展中小企业简化措施至小型中型企业；新增两项禁止性实践（“裸体化”应用和 AI 生成儿童性虐待内容）；保留认为自身不属高风险的附件三系统的数据库登记义务。", "impacts": ["高风险 AI 合规准备窗口延长 12–16 个月", "关注配套协调标准和欧委会高风险分类指南的发布进度"], "status": "已生效", "stage": "已生效", "ref": "条例 (EU) 2026/1744", "parent": "ai-act", "secondary": false, "levels": {"battery": "low", "auto": "low", "storage": "low", "upstream": null}, "batteryNote": "在 AI 法基础上推迟高风险义务", "last": ["2026-07-27", "条例 (EU) 2026/1744 生效"], "next": {"date": "2027-08-02", "kind": "deadline", "label": "成员国设立 AI 监管沙盒的新期限"}, "milestones": [{"date": "2026-07-27", "kind": "force", "label": "条例 (EU) 2026/1744 生效"}, {"date": "2027-08-02", "kind": "deadline", "label": "成员国设立 AI 监管沙盒的新期限"}], "deep": false, "oeil": "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2025/0359(COD)", "url": "https://eur-lex.europa.eu/smartapi/cgi/sga_doc?smartapi!celexplus!prod!CELEXnumdoc&lg=EN&numdoc=32026R1744"}]};

<script>
(function(){
"use strict";
var ALL = window.REG_DATA||{}, ORDER = window.REG_ORDER||Object.keys(ALL);
var LIB = window.REG_LIB||{items:[],categories:{}};
/* Routes live in the hash as plain names: #home, #library, #lib-<domain>, #law-<id>.
   Older query-string links still work. Section jumps scroll in place and leave the hash alone. */
var LAW="", VIEW="", D=null, ROUTE_CAT=null;
function setRoute(){
  var h=(location.hash||"").replace(/^#/,""), qs=new URLSearchParams(location.search);
  LAW=""; VIEW=""; ROUTE_CAT=null;
  if(/^law-/.test(h) && ALL[h.slice(4)]) LAW=h.slice(4);
  else if(h==="library") VIEW="library";
  else if(/^lib-/.test(h)){ VIEW="library"; ROUTE_CAT=h.slice(4); }
  else if(!h || h==="home"){ if(qs.get("law")&&ALL[qs.get("law")]) LAW=qs.get("law"); else if(qs.get("view")==="library"){ VIEW="library"; ROUTE_CAT=qs.get("cat"); } }
  D=ALL[LAW]||null;
}
function isRoute(h){ return h==="home"||h==="library"||/^lib-/.test(h)||/^law-/.test(h); }
setRoute();
var app = document.getElementById("app");
if(!ORDER.length){ app.textContent = "数据加载失败"; return; }
var TODAY = new Date(); TODAY.setHours(0,0,0,0);
var ROLES = [["battery","电池企业"],["storage","储能企业"],["auto","车企"],["upstream","上游材料"]];
var LV = {high:"影响大",mid:"影响中等",low:"影响小"};
var ST = {adopted:["已通过","ok"],draft:["草案","warn"],planned:["未发布","" ]};
var actById = {};
function buildActs(){ actById={}; if(D) D.acts.forEach(function(a){ actById[a.id]=a; }); }
buildActs();
var store = { get:function(k){ try{return localStorage.getItem(k);}catch(e){return null;} }, set:function(k,v){ try{localStorage.setItem(k,v);}catch(e){} } };
var role = (location.hash.match(/role=(\w+)/)||[])[1] || store.get("role") || "battery";
if(!ROLES.some(function(r){return r[0]===role;})) role = "battery";

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function d(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function fmt(s){ return s ? s.replace(/-/g,".") : ""; }
function days(s){ return Math.round((d(s)-TODAY)/864e5); }
function rel(s){ var n=days(s); if(n===0) return "今天"; if(n>0) return n<60? n+" 天后" : (n<730? Math.round(n/30.4)+" 个月后" : (n/365.25).toFixed(1).replace(/\.0$/,"")+" 年后"); return "已适用"; }
function isOverdue(a){ return a.status!=="adopted" && a.legalDeadline && d(a.legalDeadline)<TODAY; }
function whenDate(w){ return !w ? null : (w.type==="fixed" ? w.date : w.earliest); }
function lawUrl(id){ return "#law-"+id; }
function actLink(a, label){ return a.url ? '<a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(label||a.title)+'</a>' : esc(label||a.title); }
function stPill(a){ var s=/议会|理事会|立法提案/.test(a.kind||"") ? {adopted:["已完成","ok"],draft:["审议中","warn"],planned:["待完成",""]}[a.status] : ST[a.status]; var h='<span class="pill '+s[1]+'">'+s[0]+'</span>'; if(isOverdue(a)) h+=' <span class="pill bad">已逾期</span>'; return h; }
function condNote(w){
  var a=actById[w.dependsOn]; if(!a) return "";
  var st = a.status==="adopted" ? "已通过" : (a.status==="draft" ? "仍为草案" : "尚未发布");
  return '取决于'+actLink(a, "《"+a.title+"》")+'生效后 '+w.months+' 个月（该法案'+st+(isOverdue(a)?'，已逾期':'')+'）';
}
var secN=0;
function sec(id, title, sub, body){ secN++; return '<section class="sec" id="'+id+'"><div class="sec-h"><span class="no">'+("0"+secN).slice(-2)+'</span><div><h2>'+title+'</h2>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div></div>'+body+'</section>'; }
function srcLine(){ return '<div class="src">来源：<a href="'+esc(D.sources[0].url)+'" target="_blank" rel="noopener">'+esc(D.sources[0].label)+'</a> · 核实于 '+fmt(D.checked)+'</div>'; }

/* ---------- sections ---------- */
function strip(){
  var ys=D.timeline.map(function(t){return +whenDate(t.when).slice(0,4);}).concat([TODAY.getFullYear()]);
  var y0=Math.min.apply(null,ys), y1=Math.max(Math.max.apply(null,ys)+1,y0+4), span=d(y1+"-01-01")-d(y0+"-01-01");
  var pos=function(ds){ return ((d(ds)-d(y0+"-01-01"))/span*100).toFixed(2)+"%"; };
  var ticks=""; for(var y=y0;y<y1;y++) ticks+='<span class="tk" style="left:'+pos(y+"-01-01")+'">'+((y1-y0<=8)||(y-y0)%2===0?y:"")+'</span>';
  var dots=D.timeline.map(function(t){ var dt=whenDate(t.when), c=t.when.type==="conditional"; var past=d(dt)<TODAY && !c;
    return '<span class="sd'+(c?" c":"")+(past?" p":"")+'" style="left:'+pos(dt)+'" title="'+fmt(dt)+(c?"（最早）":"")+' '+esc(t.label)+'"></span>'; }).join("");
  var tp=pos(iso(TODAY));
  return '<div class="strip" aria-hidden="true"><div class="sb"><span class="sp" style="width:'+tp+'"></span></div>'+dots+'<span class="st-today" style="left:'+tp+'"><i>今天</i></span><div class="tks">'+ticks+'</div></div><div class="strip-lg"><span><i class="sd p"></i>已适用</span><span><i class="sd"></i>固定日期</span><span><i class="sd c"></i>条件日期（最早）</span><span class="hint">悬停圆点查看节点</span></div>';
}
function hero(){
  var adopted=D.acts.filter(function(a){return a.status==="adopted";}).length, overdue=D.acts.filter(isOverdue).length;
  var kf=D.keyFigures.map(function(k,i){
    var v=k.value, n=k.note;
    if(k.computed==="acts"){ v=adopted+" / "+D.acts.length; n=k.note || (overdue? overdue+" 项已过法定期限仍未通过" : "目前没有逾期的配套文件"); }
    return '<div class="k k'+i+'"><div class="l">'+esc(k.label)+'</div><div class="v">'+esc(v)+'</div><div class="n">'+esc(n)+'</div></div>';

  var el=h?document.getElementById(h):null; if(el){ e.preventDefault(); el.scrollIntoView({behavior:"smooth"}); }
});
render();
/* section highlight */
function onScroll(){
  var cur=null; NAV.forEach(function(n){ var el=document.getElementById(n[0]); if(el && el.getBoundingClientRect().top<130) cur=n[0]; });
  links.forEach(function(a){ var on=a.getAttribute("data-sec")===cur; if(on!==a.classList.contains("on")){ a.classList.toggle("on",on); if(on) a.scrollIntoView({block:"nearest",inline:"center"}); } });
}
var tt=document.createElement("a"); tt.href="#top"; tt.className="totop"; tt.setAttribute("aria-label","回到顶部"); tt.textContent="↑"; document.body.appendChild(tt);
window.addEventListener("scroll",function(){ tt.classList.toggle("show",window.scrollY>900); },{passive:true});
window.addEventListener("scroll",onScroll,{passive:true}); onScroll();
})();
</script>
</body>
